name: Production Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Deploy Prod Environment
        env:
          CONTAINER_NAME: tu-abogado-frontend-prod
          HOST_PORT: 3000
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY_PROD }}
          VITE_RESEND_LINK: ${{ secrets.RESEND_LINK_PROD }}
          VITE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_PROD }}
        run: |
          echo "📂 Debugging: Listando archivos en el directorio actual:"
          ls -la
          
          echo "🚀 Starting DEV Deployment on Port $HOST_PORT..."
          
          echo "⬇️  Stopping Dev container..."
          # Agregamos -f docker-compose.yml explícitamente
          sudo -E docker-compose -f docker-compose.yml -p tu_abogado_dev down --remove-orphans || true
          
          echo "🏗️  Building and Starting Dev..."
          # Agregamos -f docker-compose.yml explícitamente
          sudo -E docker-compose -f docker-compose.yml -p tu_abogado_dev up -d --build
          
          echo "🧹 Pruning unused images..."
          docker image prune -f

          echo "✅ Deployment Development Complete!"